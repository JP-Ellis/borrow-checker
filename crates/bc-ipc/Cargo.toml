#:schema https://json.schemastore.org/cargo.json

[package]
name        = "bc-ipc"
description = "BorrowChecker IPC types — shared between bc-app (native) and bc-ui (WASM)"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

publish = false

[dependencies]
serde     = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest            = { workspace = true }
serde_json        = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# tauri-sys is not on crates.io; requires `esbuild` (provided via mise).
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", branch = "v2", features = [
  "core"
] }

[lints]
workspace = true
