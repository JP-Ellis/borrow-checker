#:schema https://json.schemastore.org/cargo.json

[package]
name        = "bc-service"
description = "BorrowChecker command layer shared by the desktop app and the web server"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

publish = false

[dependencies]
bc-config    = { workspace = true, features = ["ipc"] }
bc-core      = { workspace = true, features = ["ipc"] }
bc-expr      = { workspace = true }
bc-ipc       = { workspace = true, features = ["models"] }
bc-models    = { workspace = true }
bc-plugins   = { workspace = true, features = ["ipc"] }
jiff         = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
pretty_assertions   = { workspace = true }
rstest              = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile            = { workspace = true }

[lints]
workspace = true
