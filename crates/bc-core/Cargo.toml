#:schema https://json.schemastore.org/cargo.json

[package]
name        = "bc-core"
description = "BorrowChecker core engine: event log, SQLite projections, business logic"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

[[bench]]
harness = false
name    = "balance"

[dependencies]
bc-config    = { workspace = true }
bc-ipc       = { workspace = true, optional = true }
bc-models    = { workspace = true }
bon          = { workspace = true }
jiff         = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true }
tempfile     = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
criterion           = { workspace = true }
pretty_assertions   = { workspace = true }
rstest              = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio               = { workspace = true }

[features]
# Conversions from bc-core types into bc-ipc DTOs (native/Tauri side only).
ipc = ["bc-ipc/models"]

[lints]
workspace = true
