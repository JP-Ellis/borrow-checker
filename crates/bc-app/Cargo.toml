#:schema https://json.schemastore.org/cargo.json

[package]
name = "bc-app"
description = "BorrowChecker desktop GUI"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

publish = false

[dependencies]
bc-config = { workspace = true }
bc-ipc = { workspace = true }
bc-service = { workspace = true }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde_json = { workspace = true }
tauri = { version = "2", features = ["config-toml", "wry"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[lints]
workspace = true
