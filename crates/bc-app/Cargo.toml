#:schema https://json.schemastore.org/cargo.json

[package]
name        = "bc-app"
description = "BorrowChecker desktop GUI"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

publish = false

  [package.metadata.cargo-machete]
  # Phase 2 IPC commands will use these deps; forward-declared to avoid churn.
  # tauri-build is a build-dep used by build.rs (machete can't detect build.rs usage).
  ignored = ["bc-core", "bc-ipc", "bc-models", "serde", "tauri-build"]

[dependencies]
bc-core   = { workspace = true }
bc-ipc    = { workspace = true }
bc-models = { workspace = true }
serde     = { workspace = true }
tauri     = { version = "2", features = ["config-toml", "wry"] }

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[lints]
workspace = true
