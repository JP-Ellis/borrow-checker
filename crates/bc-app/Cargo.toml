#:schema https://json.schemastore.org/cargo.json

[package]
name        = "bc-app"
description = "BorrowChecker desktop GUI"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

publish = false

  [package.metadata.cargo-machete]
  # bc-models, serde: used by IPC types; tauri-build is a build-dep (machete can't detect build.rs usage).
  ignored = ["bc-models", "serde", "tauri-build"]

[dependencies]
bc-config    = { workspace = true }
bc-core      = { workspace = true }
bc-ipc       = { workspace = true }
bc-models    = { workspace = true }
jiff         = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
tauri        = { version = "2", features = ["config-toml", "wry"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[lints]
workspace = true
