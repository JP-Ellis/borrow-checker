product-name = "borrow-checker"
version      = "0.1.0"
identifier   = "me.jpellis.borrow-checker"

[build]
# Run trunk from bc-ui so it picks up its Trunk.toml (port 1420, watch ignores, etc.)
dev-url       = "http://localhost:1420"
frontend-dist = "../bc-ui/dist"

  [build.before-dev-command]
  cwd    = "../bc-ui"
  script = "stylance --watch . & trunk serve"

  [build.before-build-command]
  cwd    = "../bc-ui"
  script = "stylance . && trunk build ${WASM_RELEASE:+--release}"

[app]
with-global-tauri = true

  [[app.windows]]
  title     = "borrow-checker"
  width     = 1280
  height    = 800
  resizable = true

[bundle]
active  = false
targets = "all"
icon    = []
