#:schema https://json.schemastore.org/cargo.json

[package]
name = "bc-plugin-ledger"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true

publish = false

[lib]
# rlib only: `cdylib` is requested per-invocation by plugins/scripts/build.sh
# via `cargo rustc --crate-type cdylib`. Declaring it here would make every
# native build emit a `.so`, which cannot link — wit-bindgen's export symbols
# contain `:`, `/`, `@` and `#`, all illegal in an ELF version script.
crate-type = ["rlib"]

[dependencies]
bc-sdk       = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
winnow       = { workspace = true }

[dev-dependencies]
pretty_assertions   = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json          = { workspace = true }
