[package]
name    = "bc-plugin-beancount"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# rlib only: `cdylib` is requested per-invocation by plugins/scripts/build.sh
# via `cargo rustc --crate-type cdylib`. Declaring it here would make every
# native build emit a `.so`, which cannot link — wit-bindgen's export symbols
# contain `:`, `/`, `@` and `#`, all illegal in an ELF version script.
crate-type = ["rlib"]

[dependencies]
bc-sdk       = { path = "../../crates/bc-sdk" }
rust_decimal = "1"
serde        = { version = "1", features = ["derive"] }
winnow       = "1"

[dev-dependencies]
pretty_assertions   = "1"
rust_decimal_macros = "1"
serde_json          = "1"
