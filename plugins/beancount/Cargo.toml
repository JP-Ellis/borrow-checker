[package]
name    = "bc-plugin-beancount"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bc-sdk       = { path = "../../crates/bc-sdk" }
rust_decimal = "1"
serde        = { version = "1", features = ["derive"] }
winnow       = "1"

[dev-dependencies]
pretty_assertions   = "=1.4.1"
rust_decimal_macros = "=1.40.0"
serde_json          = "=1.0.151"
