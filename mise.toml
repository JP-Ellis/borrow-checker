#:schema https://mise.jdx.dev/schema/mise.json

monorepo_root = true

# 2026.7.6 stopped consulting cargo-quickinstall by default and added the
# setting below to opt back in — older versions cannot parse this file.
min_version = "2026.7.6"

[settings]
experimental = true

  [settings.cargo]
  binstall_quickinstall = true

[monorepo]
config_roots = [
  "crates/bc-app",
  "crates/bc-ui",
  "e2e",
]

[tools]
"core:node" = "24"
"core:rust" = {
  version    = "1.98",
  components = "llvm-tools,rustfmt,clippy",
  # wasm32-wasip2: plugin system (Wasmtime)
  # wasm32-unknown-unknown: Leptos frontend (Tauri webview)
  targets    = "wasm32-wasip2,wasm32-unknown-unknown",
}

# Binstall ensures fast installs of cargo binaries
"aqua:cargo-bins/cargo-binstall" = "1"

# JS package manager (aube) and runner (aubx)
"github:endevco/aube" = "2"

"cargo:cargo-leptos"   = "0.3"
"cargo:cargo-llvm-cov" = "0.8"
"cargo:cargo-machete"  = "0.9"
"cargo:cargo-nextest"  = "0.9"
"cargo:leptosfmt"      = "0.1"
"cargo:prek"           = "0.4"
"cargo:stylance-cli"   = "0.8"
"cargo:tauri-cli"      = "2"
"cargo:tauri-driver"   = "2"
"cargo:trunk"          = "0.21"
"npm:esbuild"          = "0.28"
"npm:sass"             = "1"

[tasks]
# MARK: Development

  [tasks."dev:app"]
  description = "Run the desktop GUI in development mode (Tauri + Trunk hot-reload)"
  depends     = ["//crates/bc-app:gen:icons"]
  usage       = 'flag "--reseed" help="Re-seed the dev database even if it already exists"'
  run         = '''
#!/usr/bin/env bash
DEV_DB="{{config_root}}/.dev-db/borrow-checker.db"
mkdir -p "$(dirname "$DEV_DB")"
if [[ ! -f "$DEV_DB" ]] || [[ "{{usage.reseed}}" == "true" ]]; then
  echo "Seeding dev database at $DEV_DB…"
  cargo run -p bc-seed -- --db-path "$DEV_DB" --force
fi
BC_DB_PATH="$DEV_DB" cargo tauri dev
'''

  [tasks."build:app"]
  description = "Build a release bundle of the desktop GUI"
  depends     = ["//crates/bc-app:gen:icons"]
  env         = { WASM_RELEASE = "1" }
  run         = "cargo tauri build"

  # MARK: Testing

  [tasks.test]
  description = "Run all unit and doc tests"
  run         = [
    { task = "test:unit" },
    { task = "test:docs" },
  ]

  # Every workspace feature (`ipc`, `models`) is purely additive: it adds
  # `From` impls, an `ipc` module, and their tests. Enabling all of them runs a
  # superset of what any other combination would, so a feature powerset here
  # would add no coverage while forcing a separate dependency build per
  # package. `lint:full` still checks that each crate compiles with them off.
  [tasks."test:unit"]
  description = "Run unit tests"
  depends     = ["build-plugins", "//crates/bc-app:gen:icons"]
  run         = "cargo nextest run --workspace --all-features"

  [tasks."test:docs"]
  description = "Run doc tests"
  depends     = ["//crates/bc-app:gen:icons"]
  run         = "cargo test --doc --workspace --all-features"

  [tasks."bench:fixtures"]
  description = "Generate cached benchmark ledgers (slow; run once)"
  run         = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p target/bench-fixtures
cargo build --release -p bc-seed
BIN=target/release/bc-seed
$BIN --db-path target/bench-fixtures/t0.db --force generate --months 24  --tx-per-month 200
$BIN --db-path target/bench-fixtures/t1.db --force generate --months 120 --tx-per-month 200
$BIN --db-path target/bench-fixtures/t2.db --force generate --months 120 --tx-per-month 2000
"""

  [tasks.bench]
  description = "Run the balance read-path benchmarks"
  run         = "cargo bench -p bc-core"

  [tasks."test:e2e"]
  description = "Run E2E tests (desktop suite; container required on macOS/Windows)"
  usage       = 'flag "--container" help="Run in a locally-built Linux container (needed on macOS/Windows)"'
  run         = "mise run {% if usage.container %}//e2e:container{% else %}//e2e:test{% endif %}"

  # MARK: Quality

  [tasks.ci]
  description = "Run the full CI suite locally (format, lint, machete, prek, tests, E2E)"
  run         = [
    { task = "format" },
    { task = "prek" },
    { task = "lint:full" },
    { task = "machete" },
    { task = "test" },
    { task = "test:e2e" },
  ]

  [tasks.prek]
  hide        = true
  description = "Run prek hooks (file hygiene, YAML/JSON/TOML/Markdown, typos, shellcheck)"
  run         = "prek run --all-files"
  env         = { SKIP = "cargo-clippy,cargo-fmt,cargo-machete" }

  [tasks.check]
  description = "Check (or fix) formatting and linting"
  usage       = 'flag "--fix" help="Apply fixes automatically"'
  run         = [
    { task = "format", args = ["{% if usage.fix %}--fix{% endif %}"] },
    { task = "lint", args = ["{% if usage.fix %}--fix{% endif %}"] },
  ]

  # MARK: Formatting

  [tasks.format]
  description = "Check or apply formatting (nightly rustfmt + leptosfmt)"
  usage       = 'flag "--fix" help="Apply changes rather than checking"'
  run         = [
    "cargo +nightly fmt {% if not usage.fix %}--check{% endif %}",
    "leptosfmt {% if not usage.fix %}--check{% endif %} crates/",
  ]

  # MARK: Linting

  # `--workspace` unifies features, so bc-app turns `ipc`/`models` on for every
  # crate. Naming the four feature-bearing crates on their own is the only way
  # to lint them with those features off, the way bc-cli and bc-ui consume them.
  [tasks."lint:full"]
  hide        = true
  description = "Lint with Clippy across every feature configuration and target (CI)"
  depends     = [
    "//crates/bc-app:gen:icons",
    "install:wasm-targets",
    "install:rust-components"
  ]
  run         = [
    "cargo clippy --workspace --all-targets --all-features -- -D warnings",
    "cargo clippy -p bc-config -p bc-core -p bc-ipc -p bc-plugins --all-targets -- -D warnings",
    "cargo clippy -p bc-ipc -p bc-ui --target wasm32-unknown-unknown -- -D warnings",
    "cargo clippy -p 'bc-plugin-*' --target wasm32-wasip2 -- -D warnings",
  ]

  [tasks.lint]
  description = "Lint with Clippy on all targets (fast, pre-commit)"
  depends     = [
    "//crates/bc-app:gen:icons",
    "install:wasm-targets",
    "install:rust-components"
  ]
  usage       = 'flag "--fix" help="Apply fixes automatically (covers every feature configuration)"'
  run         = '''
{% if usage.fix %}
  cargo clippy --workspace --all-targets --all-features --fix --allow-staged --allow-dirty -- -D warnings
  cargo clippy -p bc-config -p bc-core -p bc-ipc -p bc-plugins --all-targets --fix --allow-staged --allow-dirty -- -D warnings
  cargo clippy -p bc-ipc -p bc-ui --target wasm32-unknown-unknown --fix --allow-staged --allow-dirty -- -D warnings
  cargo clippy -p 'bc-plugin-*' --target wasm32-wasip2 --fix --allow-staged --allow-dirty -- -D warnings
{% else %}
  cargo clippy --workspace --all-targets -- -D warnings
  cargo clippy -p bc-ipc -p bc-ui --target wasm32-unknown-unknown -- -D warnings
  cargo clippy -p 'bc-plugin-*' --target wasm32-wasip2 -- -D warnings
{% endif %}
'''

  # MARK: Utilities

  [tasks.machete]
  description = "Check for unused dependencies"
  run         = "cargo machete --with-metadata"

  # Doc tests run inside llvm-cov's environment so they reuse the instrumented
  # build rather than forcing a second, uninstrumented one. cargo-llvm-cov marks
  # `--doctests` unstable, but it works on the pinned toolchain; were that to
  # regress, dropping the flag still runs the doc tests, they just stop
  # counting. nextest rejects the flag, so only the doc run and the report
  # carry it.
  [tasks.coverage]
  description = "Run unit and doc tests under coverage, emitting an LCOV report"
  depends     = ["build-plugins", "//crates/bc-app:gen:icons"]
  run         = [
    "cargo llvm-cov clean --workspace",
    "cargo llvm-cov --no-report nextest --workspace --all-features",
    "cargo llvm-cov --no-report --doctests test --doc --workspace --all-features",
    "cargo llvm-cov report --doctests --lcov --output-path coverage.lcov",
  ]

  [tasks."build-plugins"]
  description = "Compile WASM importer plugins and stage them under target/plugins/"
  depends     = ["install:wasm-targets"]
  # bc-sdk is compiled into every plugin, so a WIT or SDK change must
  # invalidate the staged .wasm artifacts. Without it a WIT-only change leaves
  # stale components behind that no longer satisfy the world.
  sources     = [
    "plugins/*/src/**/*.rs",
    "plugins/*/Cargo.toml",
    "crates/bc-sdk/src/**/*.rs",
    "crates/bc-sdk/wit/**/*.wit",
    "crates/bc-sdk/Cargo.toml",
    "crates/bc-sdk-macros/src/**/*.rs",
    "crates/bc-sdk-macros/Cargo.toml",
    "Cargo.toml",
    "Cargo.lock"
  ]
  outputs     = ["target/plugins/*.wasm"]
  shell       = "bash -c"
  run         = "plugins/scripts/build.sh"

  # MARK: Internal

  [tasks."install:wasm-targets"]
  description = "Install required WASM targets (no-op if already present)"
  run         = "rustup target add wasm32-wasip2 wasm32-unknown-unknown"

  [tasks."install:rust-components"]
  description = "Install required Rust components (no-op if already present)"
  run         = "rustup component add clippy"
