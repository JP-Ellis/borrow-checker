#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"core:rust" = {
  version    = "stable",
  components = "llvm-tools,rustfmt,clippy",
  # wasm32-wasip2: plugin system (Wasmtime); wasm32-unknown-unknown: Leptos frontend (Tauri webview)
  targets    = "wasm32-wasip2,wasm32-unknown-unknown",
}

# Binstall ensures fast installs of cargo binaries
"aqua:cargo-bins/cargo-binstall" = "1.18"

"cargo:cargo-hack"     = "0.6"
"cargo:cargo-leptos"   = "0.3"
"cargo:cargo-llvm-cov" = "0.8"
"cargo:cargo-machete"  = "0.9"
"cargo:cargo-nextest"  = "0.9"
"cargo:leptosfmt"      = "0.1"
"cargo:prek"           = "0.3"
"cargo:stylance-cli"   = "0.8"
"cargo:tauri-cli"      = "2"
"cargo:tauri-driver"   = "2"
"cargo:trunk"          = "0.21"
"npm:esbuild"          = "0.28"
"npm:sass"             = "1"

[tasks]
  [tasks.format]
  description = "Check formatting (requires nightly rustfmt)"
  run         = [
    "cargo +nightly fmt --check",
    "leptosfmt --check crates/",
  ]

  [tasks."format:fix"]
  description = "Apply formatting (requires nightly rustfmt)"
  run         = [
    "cargo +nightly fmt",
    "leptosfmt crates/",
  ]

  [tasks."lint:native"]
  description = "Lint with Clippy on native target (fast, pre-commit)"
  depends     = ["gen:icons"]
  run         = "cargo clippy --workspace --all-targets -- -D warnings"

  [tasks."install:wasm-targets"]
  description = "Install required WASM targets (no-op if already present)"
  run         = "rustup target add wasm32-wasip2 wasm32-unknown-unknown"

  [tasks."lint:wasm"]
  description = "Lint with Clippy on wasm32-unknown-unknown target (fast, pre-commit)"
  depends     = ["install:wasm-targets"]
  run         = "cargo clippy -p bc-ipc -p bc-ui --target wasm32-unknown-unknown -- -D warnings"

  [tasks.lint]
  description = "Lint with Clippy on all targets (fast, pre-commit)"
  run         = [{ task = "lint:native" }, { task = "lint:wasm" }]

  [tasks."lint:hack:native"]
  description = "Lint with Clippy across all feature combinations on native target (thorough, CI)"
  depends     = ["gen:icons"]
  run         = "cargo hack --feature-powerset --workspace clippy --all-targets -- -D warnings"

  [tasks."lint:hack:wasm"]
  description = "Lint with Clippy across all feature combinations on wasm32-unknown-unknown target (thorough, CI)"
  depends     = ["install:wasm-targets"]
  run         = "cargo hack --feature-powerset -p bc-ipc -p bc-ui clippy --target wasm32-unknown-unknown -- -D warnings"

  [tasks."lint:hack"]
  description = "Lint with Clippy across all feature combinations on all targets (thorough, CI)"
  run         = [{ task = "lint:hack:native" }, { task = "lint:hack:wasm" }]

  [tasks."lint:fix:native"]
  description = "Auto-fix lint issues across all feature combinations on native target"
  depends     = ["gen:icons"]
  run         = "cargo hack --feature-powerset --workspace clippy --all-targets --fix --allow-staged --allow-dirty -- -D warnings"

  [tasks."lint:fix:wasm"]
  description = "Auto-fix lint issues across all feature combinations on wasm32-unknown-unknown target"
  depends     = ["install:wasm-targets"]
  run         = "cargo hack --feature-powerset -p bc-ipc -p bc-ui clippy --target wasm32-unknown-unknown --fix --allow-staged --allow-dirty -- -D warnings"

  [tasks."lint:fix"]
  description = "Auto-fix lint issues across all feature combinations on all targets"
  run         = [{ task = "lint:fix:native" }, { task = "lint:fix:wasm" }]

  [tasks.check]
  description = "Run format and lint checks"
  run         = [{ task = "format" }, { task = "lint" }]

  [tasks."check:fix"]
  description = "Auto-fix format and lint issues"
  run         = [{ task = "format:fix" }, { task = "lint:fix" }]

  [tasks."test:nextest"]
  description = "Run unit tests across all feature combinations"
  depends     = ["build-plugins", "gen:icons"]
  run         = "cargo hack --feature-powerset --workspace nextest run"

  [tasks."test:docs"]
  description = "Run doc tests"
  depends     = ["gen:icons"]
  run         = "cargo test --doc --workspace"

  [tasks.test]
  description = "Run all tests (unit, integration, docs)"
  run         = [
    { task = "test:nextest" },
    { task = "test:docs" },
  ]

  [tasks.machete]
  description = "Check for unused dependencies"
  run         = "cargo machete --with-metadata"

  [tasks.coverage]
  description = "Generate LCOV coverage report"
  depends     = ["build-plugins", "gen:icons"]
  run         = "cargo llvm-cov nextest --all-features --lcov --output-path coverage.lcov"

  [tasks."build-plugins"]
  description = "Compile WASM importer plugins and stage them under target/plugins/"
  depends     = ["install:wasm-targets"]
  shell       = "bash -c"
  run         = "plugins/scripts/build.sh"

  [tasks."gen:icons"]
  description = "Generate icon set (PNG, ICO, ICNS) from icons/icon.svg"
  dir         = "crates/bc-app"
  run         = "cargo tauri icon icons/icon.svg --output icons/"

  [tasks."dev:app"]
  description = "Run the desktop GUI in development mode (Tauri + Trunk hot-reload)"
  dir         = "crates/bc-app"
  depends     = ["gen:icons"]
  run         = "cargo tauri dev"

  [tasks."build:app"]
  description = "Build a release bundle of the desktop GUI"
  dir         = "crates/bc-app"
  depends     = ["gen:icons"]
  run         = "cargo tauri build"

  [tasks."test:e2e:web"]
  description = "Run Playwright web E2E tests (trunk serve, port 1420)"
  dir         = "e2e/web"
  run         = "aubx playwright test"

  [tasks."test:e2e:native"]
  description = "Run WebdriverIO native E2E tests (tauri-driver; builds debug binary)"
  dir         = "e2e/native"
  run         = "aubx wdio run wdio.conf.ts"

  [tasks."test:e2e:native:linux"]
  description = "Run native E2E tests in a Linux container (matches CI; works on macOS)"
  run         = """
    docker build -t bc-e2e-native -f e2e/native/Containerfile .
    docker run --rm \
      -v "{{config_root}}:/repo" \
      -w /repo/e2e/native \
      -e CARGO_TARGET_DIR=/repo/target-linux \
      -e TAURI_BINARY=/repo/target-linux/debug/bc-app \
      bc-e2e-native \
      bash -c "npm install --no-package-lock && xvfb-run -a npx wdio run wdio.conf.ts"
  """

  [tasks."test:e2e"]
  description = "Run all E2E tests (web + native)"
  run         = [{ task = "test:e2e:web" }, { task = "test:e2e:native" }]
