---
name: Update E2E Snapshots

# Runs on the 1st of each month at 03:00 UTC.
# Also available via workflow_dispatch for manual triggering (e.g. bootstrapping
# the GHCR image for the first time after this workflow was added).
#
# What this workflow does:
#   1. Rebuilds the E2E container image from the Containerfile with whatever
#      apt packages are current at that point (fresh WebKitGTK, fonts, etc.).
#   2. Pushes the new image to GHCR and pins the digest in e2e/.container-image.
#   3. Runs the full E2E suite inside the new container with a frozen clock
#      (FAKETIME="2025-01-15 12:00:00") so visual baselines are date-stable.
#   4. If anything changed (new image digest or updated snapshots), opens a PR
#      using the same GitHub App token as release-plz.

on:
  schedule:
    - cron: 0 3 1 * *
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  update:
    name: Rebuild image and update baselines
    runs-on: ubuntu-latest
    if: github.repository == 'JP-Ellis/borrow-checker'

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email \
            "$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq '.id')\
            +${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Tauri system deps needed to build bc-app on the host runner.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          cache-workspaces: |
            . -> target
            . -> .linux-cache/target
          cache-directories: .linux-cache/trunk

      # MARK: Build and push container image

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        run: mise run //e2e:container:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR and record digest
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/borrow-checker-e2e"
          docker tag bc-e2e-native "$IMAGE"
          DIGEST=$(docker push "$IMAGE" | awk '/digest:/{print $3}')
          IMAGE_REF="$IMAGE@$DIGEST"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$IMAGE_REF" > e2e/.container-image

      # MARK: Run E2E tests to regenerate visual baselines

      - name: Pre-build binaries for container cache
        run: |
          cargo build -p bc-ui --target wasm32-unknown-unknown
          cargo build -p bc-seed

      - name: Prepare .linux-cache for container bind mounts
        run: |
          mkdir -p .linux-cache/node_modules
          cp -rn --link target/. .linux-cache/target/ 2>/dev/null \
            || mkdir -p .linux-cache/target

      - name: Run E2E tests (frozen clock)
        run: mise run //e2e:container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # MARK: Open PR if anything changed

      - name: Stage changed files
        id: changes
        run: |
          git add e2e/.container-image e2e/tests/visual/__snapshots__/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="chore/e2e-baselines-$(date +%Y-%m)"
          git checkout -b "$BRANCH"
          git commit -m "chore(e2e): update container image and visual baselines"
          git push --force-with-lease origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          if gh pr view --head "$BRANCH" &>/dev/null; then
            echo "PR already exists for branch $BRANCH — force-push updated it."
          else
            gh pr create \
              --title "chore(e2e): update E2E container image and visual baselines" \
              --body "$(cat <<'EOF'
          ## Summary

          Monthly automated update of the E2E container image and visual baselines.

          - Rebuilt the `e2e/Containerfile` image with the latest apt packages
            (includes any WebKitGTK / font updates since the previous image).
          - Pushed to GHCR and updated the pinned digest in `e2e/.container-image`.
          - Re-ran the full E2E suite with the same frozen clock
            (`FAKETIME="2025-01-15 12:00:00"`) to regenerate visual baselines.

          Visual snapshots only change when WebKitGTK or its dependencies render
          things differently — the seed data and date are always identical.
          EOF
              )"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
