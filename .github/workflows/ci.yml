---
name: CI

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: '1'
  FORCE_COLOR: '1'
  NEXTEST_PROFILE: ci
  MISE_CARGO_BINSTALL_ONLY: 'true'
  MISE_ENV: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ## Sentinel: required checks gate
  complete:
    name: CI complete
    if: always()
    needs:
      - committed
      - prek
      - lint
      - format
      - machete
      - test
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Failed
        run: exit 1
        if: >
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  committed:
    name: Committed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f  # v1.1.11
        with:
          args: --no-merge-commit

  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d  # v2.0.4
        env:
          # Rust hooks run in the dedicated lint/format/machete jobs below
          SKIP: cargo-clippy,cargo-fmt,cargo-machete

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: mise run lint:hack

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - run: rustup toolchain add nightly --component rustfmt --no-self-update
      - run: mise run format

  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - run: mise run machete

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: beta
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain != 'stable' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - if: runner.os == 'Linux'
        run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: rustup toolchain install ${{ matrix.toolchain }} --no-self-update
        if: matrix.toolchain != 'stable'
      - run: mise run test
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      - name: Pre-build binaries for container cache
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: |
          cargo build -p bc-ui --target wasm32-unknown-unknown
          cargo build -p bc-seed
      - name: Prepare .linux-cache for container bind mounts
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: |
          # Docker requires real directories as bind-mount sources (not symlinks).
          # node_modules: empty dir; aube install inside the container populates it
          #   from the pnpm global store baked into the image.
          # target: hard-link from the host Cargo build (already warmed by
          #   Swatinem/rust-cache) so the container reuses the pre-built binary,
          #   including wasm32-unknown-unknown artifacts for the Leptos frontend.
          mkdir -p .linux-cache/node_modules
          cp -rn --link target/. .linux-cache/target/ 2>/dev/null \
            || mkdir -p .linux-cache/target
      - name: Obtain E2E container image
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: |
          IMAGE="$(cat e2e/.container-image 2>/dev/null)"
          if [[ "$IMAGE" == ghcr.io/* ]]; then
            # Pull the exact pinned image from GHCR for a reproducible environment.
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
          else
            # No pinned image yet — build the container locally.
            # Run the update-e2e-snapshots workflow once to bootstrap the GHCR image.
            mise run //e2e:container:build
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run E2E desktop tests (in container)
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: mise run //e2e:container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: mise run coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN || '' }}
