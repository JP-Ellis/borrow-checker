---
name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: '1'
  FORCE_COLOR: '1'
  NEXTEST_PROFILE: ci
  MISE_CARGO_BINSTALL_ONLY: 'true'
  MISE_ENV: ci
  # Debuginfo is roughly a third of the target directory, which is both compile
  # time (PDB writing dominates the Windows link) and cache size against the
  # 10 GB repository limit. Backtraces keep function names without it; only
  # file/line is lost, and llvm-cov reads its mapping from __llvm_covmap rather
  # than DWARF, so coverage figures are unchanged.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ## Sentinel: required checks gate
  complete:
    name: CI complete
    if: always()
    needs:
      - committed
      - prek
      - lint
      - format
      - machete
      - test
      - coverage
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Failed
        run: exit 1
        if: >
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  committed:
    name: Committed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f  # v1.1.11
        with:
          args: --no-merge-commit

  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        env:
          # Rust hooks run in the dedicated lint/format/machete jobs below
          SKIP: cargo-clippy,cargo-fmt,cargo-machete

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          # A run may only restore caches from its own ref or the default
          # branch, so a cache written on a pull request is unreadable by every
          # other pull request. Writing them anyway pushed the repository past
          # the 10 GB limit on each run, evicting main's entries and leaving
          # every job to build from cold. Only main populates the cache now.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run lint:full

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          # rustfmt and leptosfmt compile nothing, so the cache held only a
          # registry copy while consuming part of the repository's 10 GB.
          cache: false
      - run: rustup toolchain add nightly --component rustfmt --no-self-update
      - run: mise run format

  machete:
    name: Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          # cargo-machete parses manifests and sources; it compiles nothing.
          cache: false
      - run: mise run machete

  test:
    name: Test (${{ matrix.os }})
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run test

  # Linux stable runs its tests under llvm-cov rather than alongside a separate
  # Coverage job. Instrumented artifacts share no fingerprint with plain ones,
  # so two jobs meant building every dependency twice to run the same tests.
  # Codecov reports the result as an annotation and never fails the build, so
  # the instrumented run is a safe substitute for the plain one.
  coverage:
    name: Test & coverage (ubuntu-latest)
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN || '' }}

  e2e:
    name: E2E (ubuntu-latest)
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            webkit2gtk-driver \
            xvfb

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run E2E desktop tests
        run: xvfb-run -a mise run //e2e:test
        env:
          # Quieten warnings inherent to a headless runner, none of which the
          # suite can act on: there is no accessibility bus for GTK to reach,
          # and Xvfb offers no GPU for WebKit's DMA-BUF/DRI3 path.
          NO_AT_BRIDGE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'

  # Beta is advisory and gates nothing, so it runs on pushes to main rather than
  # on every pull request, where it cost a full cold build for no signal a
  # reviewer acts on.
  test-beta:
    name: Test (ubuntu-latest, beta)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Tauri system deps — https://v2.tauri.app/start/prerequisites/#linux
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup toolchain install beta --no-self-update
      - run: mise run test
        env:
          RUSTUP_TOOLCHAIN: beta
