---
name: E2E

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  FORCE_COLOR: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-web:
    name: E2E Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      - name: Generate stylance CSS bundle
        working-directory: crates/bc-ui
        run: stylance .

      - name: Install npm dependencies
        working-directory: e2e/web
        run: aube install

      - name: Install Playwright browsers
        working-directory: e2e/web
        run: aubx playwright install --with-deps

      - name: Run Playwright web suite
        working-directory: e2e/web
        run: aubx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/web/playwright-report/
          retention-days: 7

  e2e-native:
    name: E2E Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            continue_on_error: false
          - os: macos-latest
            # tauri-webdriver for WKWebView is experimental (Feb 2026)
            continue_on_error: true
          - os: windows-latest
            continue_on_error: false
    continue-on-error: ${{ matrix.continue_on_error }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev webkit2gtk-driver libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      - name: Install tauri-driver
        run: cargo install tauri-driver

      # macOS: tauri-webdriver is experimental — update this step when a stable
      # cargo install path is published. Until then, the macOS job is best-effort.
      - name: Install tauri-webdriver (macOS, experimental)
        if: runner.os == 'macOS'
        run: |
          echo "tauri-webdriver is not yet on crates.io."
          echo "See https://github.com/danielraffel/tauri-webdriver for install instructions."
          echo "Update this step once a stable install path is available."

      - name: Build Tauri debug binary
        working-directory: crates/bc-app
        run: cargo tauri build --debug

      - name: Install npm dependencies
        working-directory: e2e/native
        run: aube install

      - name: Run WebdriverIO native suite
        working-directory: e2e/native
        env:
          SKIP_BUILD: '1'
        run: aubx wdio run wdio.conf.ts

      - name: Upload WebdriverIO logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs-${{ matrix.os }}
          path: e2e/native/logs/
          retention-days: 7
