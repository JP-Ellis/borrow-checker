---
name: E2E

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  FORCE_COLOR: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-web:
    name: E2E Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      - name: Run Playwright web suite
        run: mise run test:e2e:web:update

      - name: Upload snapshot baselines (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-snapshots-linux
          path: e2e/web/tests/**/*-snapshots/
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/web/playwright-report/
          retention-days: 7

  e2e-native:
    name: E2E Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            continue_on_error: false
          - os: macos-latest
            # tauri-webdriver for WKWebView is experimental (Feb 2026)
            continue_on_error: true
          - os: windows-latest
            continue_on_error: false
    continue-on-error: ${{ matrix.continue_on_error }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev webkit2gtk-driver libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1

      # macOS: tauri-webdriver is experimental — update this step when a stable
      # cargo install path is published. Until then, the macOS job is best-effort.
      - name: Install tauri-webdriver (macOS, experimental)
        if: runner.os == 'macOS'
        run: |
          echo "tauri-webdriver is not yet on crates.io."
          echo "See https://github.com/danielraffel/tauri-webdriver for install instructions."
          echo "Update this step once a stable install path is available."

      - name: Run WebdriverIO native suite
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} mise run test:e2e:native

      - name: Upload WebdriverIO logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: wdio-logs-${{ matrix.os }}
          path: e2e/native/logs/
          retention-days: 7
