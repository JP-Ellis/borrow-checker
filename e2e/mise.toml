[tasks.setup]
description = "Install npm dependencies"
sources     = ["package.json", "aube-lock.yaml"]
outputs     = ["node_modules/.aube-state/state.json"]
run         = "aube install"

[tasks.test]
description = "Run WebdriverIO native E2E tests (builds app + seeds DB automatically)"
depends     = [":setup", "//crates/bc-app:build:debug"]
env         = { SKIP_BUILD = "1" }
run         = "aubx wdio run wdio.conf.ts"

# MARK: Container tasks
# These tasks build and run a Linux container so tests run on WebKitGTK
# regardless of the host OS (mirrors CI).  {{config_root}} expands to the
# absolute path of e2e/, so {{config_root}}/.. is the repo root.
#
# Two paths to obtain the container image:
#   container:build  — build bc-e2e-native from the local Containerfile
#   container:pull   — pull the pinned digest from GHCR (requires login)
#
# The main `container` task delegates to three sub-tasks:
#   container:cache-dirs          — create .linux-cache/ dirs as the current user
#   container:linux-node-modules  — copy node_modules from the image (once per image)
#   container:linux-build         — compile bc-app + bc-seed inside the container
#
# `container` uses whichever image is available; CI pulls the pinned image
# and the update-e2e-snapshots workflow rebuilds and re-pins it monthly.

[tasks."container:build"]
description = "Build the E2E container image locally (tags it as bc-e2e-native)"
run         = """
#!/usr/bin/env bash
# Always target linux/amd64 — the container runs on amd64 CI and must match.
# On Apple Silicon this cross-compiles via QEMU; on CI it is native.
# DOCKER_BUILDKIT=1 enables BuildKit (required for --mount=type=secret and
# heredoc RUN syntax) without needing the separate docker-buildx plugin.
DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -t bc-e2e-native \
      -f {{config_root}}/Containerfile \
      ${GITHUB_TOKEN:+--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN} \
      --build-arg NODE_VERSION="$(node --version)" \
      --build-arg MISE_VERSION="$(mise version | cut -d' ' -f1)" \
      --build-arg BINSTALL_VERSION="$(cargo-binstall -V)" \
      --build-arg TRUNK_VERSION="$(trunk --version | cut -d' ' -f2)" \
      --build-arg STYLANCE_VERSION="$(stylance --version | cut -d' ' -f2)" \
      --build-arg AUBE_VERSION="$(aube --version | cut -d' ' -f1)" \
      {{config_root}}/..
"""

[tasks."container:pull"]
description = "Pull the pinned E2E container image from GHCR (reads e2e/.container-image)"
run         = """
#!/usr/bin/env bash
IMAGE="$(cat {{config_root}}/.container-image 2>/dev/null)"
[[ -n "$IMAGE" ]] || { echo "e2e/.container-image is empty — run the update-e2e-snapshots workflow first"; exit 1; }
docker pull "$IMAGE"
"""

[tasks."container:cache-dirs"]
description = "Create .linux-cache directories on the host (prevents Docker from owning them as root)"
run         = """
mkdir -p "{{config_root}}/../.linux-cache/target" \
         "{{config_root}}/../.linux-cache/node_modules" \
         "{{config_root}}/../.linux-cache/trunk"
"""

[tasks."container:linux-node-modules"]
description = "Copy node_modules from the container image into the Linux cache (once per image)"
depends     = ["container:cache-dirs"]
sources     = ["package.json", "aube-lock.yaml", "../.container-image"]
outputs     = ["../.linux-cache/node_modules/.aube-state/state.json"]
run         = '''
#!/usr/bin/env bash
IMAGE="$(cat {{config_root}}/.container-image 2>/dev/null || echo bc-e2e-native)"
docker run --rm \
  -v "{{config_root}}/../.linux-cache/node_modules:/repo/e2e/node_modules" \
  "$IMAGE" \
  bash -c 'cp -rn /build/e2e/node_modules/. /repo/e2e/node_modules/'
'''

[tasks."container:linux-build"]
description = "Compile bc-app and bc-seed inside the Linux container (skipped when sources unchanged)"
depends     = ["container:cache-dirs"]
sources     = [
  "../crates/**/*.rs",
  "../crates/**/*.scss",
  "../crates/**/*.html",
  "../Cargo.toml",
  "../Cargo.lock",
  "../crates/**/Cargo.toml",
  "../.container-image",
]
outputs     = [
  "../.linux-cache/target/debug/bc-app",
  "../.linux-cache/target/debug/bc-seed",
]
run         = '''
#!/usr/bin/env bash
IMAGE="$(cat {{config_root}}/.container-image 2>/dev/null || echo bc-e2e-native)"
docker run --rm \
  -v "{{config_root}}/..:/repo" \
  -v "{{config_root}}/../.linux-cache/target:/repo/target" \
  -v "{{config_root}}/../.linux-cache/trunk:/root/.cache/trunk" \
  "$IMAGE" \
  bash -c 'set -euo pipefail
    mise run //crates/bc-app:build:debug
    cargo build -p bc-seed'
'''

[tasks.container]
description = "Run E2E tests in a Linux container with a frozen clock for reproducible snapshots"
depends     = ["container:linux-build", "container:linux-node-modules"]
run         = '''
#!/usr/bin/env bash
IMAGE="$(cat {{config_root}}/.container-image 2>/dev/null || echo bc-e2e-native)"
# Frozen wall-clock date for reproducible visual baselines.
# FAKETIME_DONT_FAKE_MONOTONIC preserves the monotonic clock so that
# WebdriverIO waitFor timeouts fire correctly despite the fake wall clock.
FAKE_NOW="2025-01-15 12:00:00"
docker run --rm \
  -v "{{config_root}}/..:/repo" \
  -v "{{config_root}}/../.linux-cache/target:/repo/target" \
  -v "{{config_root}}/../.linux-cache/node_modules:/repo/e2e/node_modules" \
  -v "{{config_root}}/../.linux-cache/trunk:/root/.cache/trunk" \
  -w /repo \
  -e DISPLAY=:99 \
  -e FAKETIME="$FAKE_NOW" \
  -e FAKETIME_DONT_FAKE_MONOTONIC=1 \
  -e WDIO_IN_CONTAINER=1 \
  "$IMAGE" \
  bash -c 'set -euo pipefail
    Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
    XVFB_PID=$!
    trap "kill $XVFB_PID 2>/dev/null" EXIT
    sleep 1
    LIBFAKETIME="$(ls /usr/lib/*/faketime/libfaketime.so.1 2>/dev/null | head -1)"
    cd /repo/e2e
    LD_PRELOAD="$LIBFAKETIME" SEED_BIN="/repo/target/debug/bc-seed" SKIP_BUILD=1 aubx wdio run wdio.conf.ts; STATUS=$?
    kill $XVFB_PID 2>/dev/null
    exit $STATUS'
'''
