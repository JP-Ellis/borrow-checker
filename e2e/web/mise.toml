[tasks.install]
description = "Install dependencies for web E2E tests"
usage       = '''
flag "--browser" negate="--no-browser" {
  default #true
  help "Install Playwright browsers"
  long_help """
  Install Playwright browsers.

  This should generally be left enabled. It is offered as an option to avoid
  re-installing browsers within the container, as the container pre-installs
  during the image build.
  """
}
'''
run         = [
  "aube install",
  "{% if usage.browser %}aubx playwright install --with-deps chromium{% endif %}"
]

[tasks.test]
description = "Run Playwright web E2E tests"
usage       = '''
flag "--browser" negate="--no-browser" {
  default #true
  help "Install Playwright browsers before running"
  long_help """
  Install Playwright browsers before running tests.

  This should generally be left enabled. It is offered as an option to avoid
  re-installing browsers within the container, as the container pre-installs
  during the image build.
  """
}
flag "--ignore-snapshots" negate="--no-ignore-snapshots" {
  default #true
  help "Ignore screenshot and snapshot expectations (default for local runs)"
}
flag "--update-snapshots" help="Update snapshots with actual results"
'''
depends     = [
  {
    task = ":install",
    args = ["{% if usage.browser %}--browser{% else %}--no-browser{% endif %}"]
  },
  "//:install:wasm-targets",
  "//crates/bc-ui:gen:styles"
]
run         = "aubx playwright test{% if usage.ignore_snapshots %} --ignore-snapshots{% endif %}{% if usage.update_snapshots %} --update-snapshots{% endif %}"

# MARK: Container tasks
# These tasks build and run a Linux container so snapshot baselines are
# generated with consistent font rendering regardless of the host OS.
# {{config_root}} expands to the absolute path of e2e/web/, so
# {{config_root}}/../.. navigates to the repo root for docker context.

[tasks."container:build"]
description = "Build the web E2E container image"
run         = """
#!/usr/bin/env bash
docker build -t bc-e2e-web -f {{config_root}}/Containerfile \
      ${GITHUB_TOKEN:+--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN} \
      --build-arg NODE_VERSION="$(node --version | cut -d' ' -f1)" \
      --build-arg MISE_VERSION="$(mise version | cut -d' ' -f1)" \
      --build-arg BINSTALL_VERSION="$(cargo-binstall -V)" \
      --build-arg TRUNK_VERSION="$(trunk --version | cut -d' ' -f2)" \
      --build-arg STYLANCE_VERSION="$(stylance --version | cut -d' ' -f2)" \
      --build-arg AUBE_VERSION="$(aube --version | cut -d' ' -f1)" \
      {{config_root}}/../..
"""

[tasks.container]
description = "Run web E2E tests in a Linux container (matches CI; works on macOS)"
depends     = [":container:build"]
usage       = 'flag "--update-snapshots" help="Update snapshot baselines with actual results"'
run         = '''
#!/usr/bin/env bash
docker run --rm \
  -v "{{config_root}}/../..:/repo" \
  -w /repo \
  -e CARGO_TARGET_DIR=/repo/target-linux \
  bc-e2e-web \
  mise run //e2e/web:test --no-browser --no-ignore-snapshots{% if usage.update_snapshots %} --update-snapshots{% endif %}
'''
