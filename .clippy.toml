#:tombi toml-version = "v1.0.0"

# Project name — not a Rust identifier, should not need backticks in docs
doc-valid-idents = ["..", "BorrowChecker", "SQLite"]

# Clippy's default only allows 2 segments; 3 is fine before requiring `use`
absolute-paths-max-segments = 3

# Relax in test code
allow-expect-in-tests = true
allow-panic-in-tests  = true
allow-print-in-tests  = true
allow-unwrap-in-tests = false  # Prefer .expect("reason") over .unwrap() even in tests

disallowed-macros = [
  { path = "std::assert_eq", replacement = "pretty_assertions::assert_eq" },
  { path = "std::assert_ne", replacement = "pretty_assertions::assert_ne" },
  # assert_matches is nightly-only, hence the `allow-invalid` to avoid errors in stable builds
  { path = "std::assert_matches::assert_matches", replacement = "pretty_assertions::assert_matches", allow-invalid = true },
  { path = "std::assert_matches::debug_assert_matches", replacement = "pretty_assertions::debug_assert_matches", allow-invalid = true },
]

# Prefer semi-colons inside blocks _except_ for single-line blocks
semicolon-inside-block-ignore-singleline = true
semicolon-outside-block-ignore-multiline = true

# We split `impl` across modules; one file with multiple impls is fine
inherent-impl-lint-scope = "module"
